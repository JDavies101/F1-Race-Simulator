name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the engine only needs numpy and matplotlib, no need for streamlit here
      - run: pip install numpy matplotlib pytest
      - run: python -m pytest -v
